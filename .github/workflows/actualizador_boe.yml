name: Actualizador Diario del BOE Nacional

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Botón manual de emergencia

jobs:
  extraer-datos:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código de tu repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar el cerebro (Python 3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: 4. Encender el motor principal (Rastreo Nacional)
      run: python motor_principal.py

    - name: 5. Sobrescribir JSON y enviar a producción
      run: |
        git config --global user.name "Robot Automático DaaS"
        git config --global user.email "robot@tu-api.com"
        git add subastas_nacionales.json
        git commit -m "Actualización DaaS Nacional: Nuevos inmuebles de madrugada" || exit 0
        git pull --rebase origin main
        git push  